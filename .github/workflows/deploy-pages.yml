name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/latest.schema.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Stage the site: web/ verbatim, plus latest.schema.json so the
      # `$schema` URL baked into generated latest.json files resolves on
      # this domain for schema-aware editors.
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R web/. _site/
          cp .github/latest.schema.json _site/latest.schema.json

      # The artifact name includes the run attempt so re-running the job
      # after a transient Pages failure works; artifacts persist across
      # attempts, and deploy-pages refuses to deploy when two artifacts
      # share the default "github-pages" name.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
