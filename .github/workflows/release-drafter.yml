name: Release Drafter

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One run at a time, never cancelled mid-run: the version-bump commit at the
# end of a run triggers the next one, which waits here. A run still waiting
# when yet another push arrives is replaced by it; the newer run drafts the
# same release from all merged PRs, so nothing is lost.
concurrency:
  group: release-drafter
  cancel-in-progress: false

permissions: {}

jobs:
  release-drafter:
    runs-on: ubuntu-latest
    environment: release-drafter
    permissions:
      # Cancel in-flight release builds before wiping the draft's assets.
      actions: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}

      # A release build from an older push could otherwise upload after the
      # cleanup below, leaving its files (with old names, if the version
      # changed) next to the new build's, or strip the warning that "Draft
      # release" is about to restore. Cancel every in-flight release build and
      # wait for each to finish stopping before touching the draft at all. A
      # build triggered after this point is caught by build.yml's
      # current-commit checks instead.
      - name: Stop in-flight release builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Filter by status on the server rather than scanning the newest
          # runs: a re-run of an old build keeps its original place in the
          # run history, however far back that is.
          run_ids=""
          for status in requested queued pending waiting in_progress; do
            if ! ids=$(gh api --paginate \
                "repos/${REPO}/actions/workflows/build.yml/runs?event=workflow_run&status=${status}&per_page=100" \
                --jq '.workflow_runs[].id'); then
              echo "::error::Failed to list ${status} release builds."
              exit 1
            fi
            if [ -n "$ids" ]; then
              run_ids="${run_ids}${ids}"$'\n'
            fi
          done
          # A run can change status between the queries above; list it once.
          run_ids=$(printf '%s' "$run_ids" | awk 'NF && !seen[$0]++' | tr '\n' ' ')
          if [ -z "$run_ids" ]; then
            echo "No release builds in flight."
            exit 0
          fi
          for id in $run_ids; do
            echo "Cancelling release build $id"
            # A run that finishes on its own meanwhile rejects the cancel;
            # the wait below is what decides success.
            gh api -X POST "repos/${REPO}/actions/runs/${id}/cancel" --silent || true
          done
          # Up to 10 minutes; force-cancel anything still running after 5.
          for attempt in $(seq 1 60); do
            sleep 10
            remaining=""
            for id in $run_ids; do
              if ! status=$(gh api "repos/${REPO}/actions/runs/${id}" --jq '.status'); then
                echo "::error::Failed to read the status of run $id."
                exit 1
              fi
              if [ "$status" != "completed" ]; then
                remaining="$remaining $id"
              fi
            done
            if [ -z "$remaining" ]; then
              echo "All release builds stopped."
              exit 0
            fi
            run_ids=$remaining
            if [ "$attempt" -eq 30 ]; then
              for id in $run_ids; do
                echo "Force-cancelling release build $id"
                gh api -X POST "repos/${REPO}/actions/runs/${id}/force-cancel" --silent || true
              done
            fi
          done
          echo "::error::Release builds still running after 10 minutes:${run_ids}"
          exit 1

      # release-drafter v7 reads its `token` input (default github.token) and
      # ignores a GITHUB_TOKEN env var, so the app token must go through `with:`.
      - name: Draft release
        uses: release-drafter/release-drafter@v7.11.0
        id: release-draft
        with:
          token: ${{ steps.generate-token.outputs.token }}

      # Release Drafter has just reset the body to the template, putting the
      # "do not publish" warning back. The assets attached to the draft are
      # from the previous build and no longer match the new changes, so drop
      # them all; the build workflow's release job uploads a fresh set and
      # then removes the warning again.
      - name: Delete stale assets from draft release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_ID: ${{ steps.release-draft.outputs.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! draft=$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq '.draft'); then
            echo "::error::Failed to fetch release ${RELEASE_ID}."
            exit 1
          fi
          if [ "$draft" != "true" ]; then
            echo "::error::Release ${RELEASE_ID} is not a draft; refusing to delete its assets."
            exit 1
          fi
          if ! asset_ids=$(gh api --paginate "repos/${REPO}/releases/${RELEASE_ID}/assets" --jq '.[].id'); then
            echo "::error::Failed to list assets of release ${RELEASE_ID}."
            exit 1
          fi
          if [ -z "$asset_ids" ]; then
            echo "No assets to delete."
            exit 0
          fi
          for id in $asset_ids; do
            echo "Deleting asset $id"
            gh api "repos/${REPO}/releases/assets/${id}" --method DELETE --silent
          done

      # Update version numbers in Cargo.toml and tauri.conf.json
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Calculate version
        id: version
        run: |
          tag="${{ steps.release-draft.outputs.tag_name }}"
          echo "version=${tag:1}" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      # One table-driven step rewrites every version-bearing file; adding a
      # file is one line in the script's table instead of another sed step.
      - name: Set versions
        run: |
          python3 .github/scripts/set_version.py "${{ steps.version.outputs.version }}"

      - name: Update Cargo.lock
        run: |
          cd src-tauri
          cargo update --workspace

      # Commit via the GraphQL API so the commit is signed/verified as the GitHub App.
      - name: Commit changes
        uses: actions/github-script@v9.0.0
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const changed = execSync('git diff --name-only', { encoding: 'utf8' })
              .split('\n')
              .map(s => s.trim())
              .filter(Boolean);

            if (changed.length === 0) {
              core.info('No changes to commit.');
              return;
            }

            const additions = changed.map(path => ({
              path,
              contents: fs.readFileSync(path).toString('base64'),
            }));

            const expectedHeadOid = execSync('git rev-parse HEAD', { encoding: 'utf8' }).trim();
            const branchName = context.ref.replace(/^refs\/heads\//, '');

            const result = await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid url }
                }
              }
            `, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                  branchName,
                },
                message: { headline: `Bump version to ${process.env.VERSION}` },
                expectedHeadOid,
                fileChanges: { additions },
              },
            });

            core.info(`Created signed commit ${result.createCommitOnBranch.commit.oid}`);
            core.info(result.createCommitOnBranch.commit.url);
