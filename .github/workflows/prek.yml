name: prek

# Runs the hooks in prek.toml on every PR, including the repo's only ruff gate.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Python comes from .python-version, prek and ruff from uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run prek
        run: uv run --locked prek run --all-files --show-diff-on-failure --color=always
        env:
          # Gated by `Lint & Test`, which has the libraries clippy needs.
          PREK_SKIP: cargo-fmt,cargo-clippy
