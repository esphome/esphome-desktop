name: Scripts Test

# Unit tests for the repo's first-party Python: the release tooling under
# .github/scripts/, the runtime helpers under src-tauri/scripts/ that the Rust
# binary embeds via include_str!, and the build-time generators under
# build-scripts/. The release manifest generator drives in-app self-updates and
# device_builder_maintenance.py heals the bundled install (#190); a bug in
# either ships to every user, and the main Build workflow only *runs* them
# during a release, so this job gates the logic on every relevant PR. Ruff lint
# and format run in the prek workflow (prek.yml), which covers every PR.

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scripts-test.yml"
      - "build-scripts/**"
      - "src-tauri/scripts/**"
      - "tests/**"
      - ".github/workflows/**"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Python scripts test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The device-builder maintenance helper depends on importlib.metadata
        # behavior and filesystem semantics that differ by OS (the #190 loop
        # manifested on Windows), so exercise every platform we ship. We bundle
        # CPython 3.14, so that is the only version worth testing.
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Python comes from .python-version, pytest from uv.lock.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Run script tests
        run: uv run --locked pytest tests/ -v
