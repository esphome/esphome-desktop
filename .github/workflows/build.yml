name: Build

concurrency:
  # For workflow_run events (release builds), use a fixed group so new runs cancel
  # in-flight ones. For PR events, use the ref for per-branch concurrency.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_run' && 'release' || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Release Drafter"]
    types: [completed]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # NOTE: the "cancel superseded Build runs" fallback lives in its own
  # workflow (cancel-superseded-builds.yml), NOT here. A job inside this
  # workflow can never do that cancelling: when `cancel-in-progress` (above)
  # misses, the superseding run waits at this workflow's concurrency gate with
  # no jobs started, so an in-run canceller only executes in the cases where
  # the gate already cleared and there is nothing left to cancel.

  # On pull requests, decide whether the build matrix needs to run at all. A PR
  # that only touches documentation or repo meta files skips it (the logic and
  # its fail-safe bias live in .github/scripts/determine_jobs.py). The CI Status
  # job below turns a skipped build into a passing required check, so a docs-only
  # PR merges without paying for the ~60 minute matrix. The release
  # workflow_run skips this job and builds regardless.
  determine-jobs:
    name: Determine jobs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # determine_jobs.py reads the PR's changed files via `gh pr diff`; without
      # pull-requests:read the token is denied, the script fails safe to
      # run-everything, and the docs-only skip silently never happens.
      pull-requests: read
    outputs:
      build: ${{ steps.determine.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version
      - name: Determine jobs
        id: determine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          output=$(python3 .github/scripts/determine_jobs.py)
          echo "$output" | jq
          echo "build=$(echo "$output" | jq -r '.build')" >> "$GITHUB_OUTPUT"

  # One exact tauri-cli version for the whole run (see
  # .github/scripts/resolve_tauri_cli_version.py), so a release's build leg
  # and the bundle-sign-upload.yml bundle job that finishes it run the same CLI
  # even if a patch is published in between.
  resolve-tauri-cli:
    name: Resolve Tauri CLI version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
          sparse-checkout: |
            .python-version
            .github/scripts
            src-tauri/Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Resolve Tauri CLI version
        id: resolve
        run: python3 .github/scripts/resolve_tauri_cli_version.py

  # Release builds embed every translated locale (src-tauri/build.rs picks up
  # whatever JSON files sit in src-tauri/translations/ at compile time). The
  # download runs in its own small job so the Lokalise API token is only ever
  # exposed here — never to the build matrix, which runs pip installs and the
  # full bundler. PR builds skip this and build English-only.
  download-translations:
    name: Download translations from Lokalise
    # Release builds come only from Release Drafter runs on main; the build
    # job needs this one to succeed, so a run from anywhere else builds
    # nothing.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    # The Lokalise credentials live in the `lokalise` environment.
    environment: lokalise
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Download from Lokalise
        # Non-English locales are gitignored, so pull them before building to
        # ship fully-translated binaries. Unset secrets downgrade the release
        # to English-only with a warning rather than failing it, so releases
        # keep flowing while the Lokalise project is being bootstrapped (and
        # on forks, where the secrets are unreachable). Once translations are
        # established, tighten this to a hard failure on the canonical repo
        # like device-builder-frontend does.
        env:
          LOKALISE_API_TOKEN: ${{ secrets.LOKALISE_API_TOKEN }}
          LOKALISE_PROJECT_ID: ${{ secrets.LOKALISE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${LOKALISE_API_TOKEN}" ] || [ -z "${LOKALISE_PROJECT_ID}" ]; then
            echo "::warning::Lokalise secrets unset; building English-only."
            exit 0
          fi
          python3 .github/scripts/translations.py download

      - name: Upload translations artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: translations
          # en.json is always present, so the artifact stays non-empty even
          # when no locales were downloaded — the build job's restore step
          # then never fails on a missing artifact.
          path: src-tauri/translations/

  build:
    # Only run release builds when the Release Drafter workflow succeeded AND
    # the download-translations job delivered its artifact: a failed Lokalise download
    # must block the release rather than silently shipping English-only
    # binaries. PR builds run regardless (translations is skipped there,
    # hence the `always()`).
    needs: [resolve-tauri-cli, download-translations, determine-jobs]
    if: >-
      always() && needs.resolve-tauri-cli.result == 'success' && (
        (github.event_name == 'pull_request' && needs.download-translations.result == 'skipped' && needs.determine-jobs.outputs.build == 'true') ||
        (github.event.workflow_run.conclusion == 'success' && needs.download-translations.result == 'success')
      )
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: windows-x64
            bundles: nsis
          - platform: linux
            os: ubuntu-22.04
            target: linux-x64
            bundles: appimage
            # Pinned commit of tauri-apps/tauri feat/truly-portable-appimage.
            tauri_rev: 105550cf9986a1a752eafb288baa562d6a564cce
          - platform: linux
            os: ubuntu-22.04
            target: linux-x64
            bundles: deb,rpm
          - platform: linux
            os: ubuntu-22.04-arm
            target: linux-arm64
            bundles: appimage
            # Pinned commit of tauri-apps/tauri feat/truly-portable-appimage.
            tauri_rev: 105550cf9986a1a752eafb288baa562d6a564cce
          - platform: linux
            os: ubuntu-22.04-arm
            target: linux-arm64
            bundles: deb,rpm
          - platform: macos
            os: macos-15
            target: macos-arm64
            rust_target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos
            os: macos-15
            target: macos-x64
            rust_target: x86_64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}
    # The slowest job (macOS) runs ~13 min; cap well above that so a hung step
    # fails fast instead of running out the 360 minute default.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # For workflow_run events, check out the commit that triggered the
          # Release Drafter workflow (the latest push to main).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Locale files come from the `download-translations` job (which holds the
      # Lokalise credentials); this job never sees the API token. The
      # artifact always carries en.json, so this overwrites the checked-out
      # copy with itself and adds any downloaded locales, which
      # src-tauri/build.rs then embeds into the binary. PR builds skip this
      # and build English-only.
      - name: Restore translations
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8.0.2
        with:
          name: translations
          path: src-tauri/translations/

      # Linux-specific dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        uses: $/.github/actions/linux-tauri-deps

      # Floating `stable` toolchain (the action's default), unlike the pinned
      # lint gates in lint-test.yml.
      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: ${{ matrix.target }}

      # Stock jobs install the prebuilt cargo-tauri resolve-tauri-cli picked
      # (see the action for the binstall rationale). The AppImage jobs build a
      # pinned fork instead, so they skip this.
      - name: Install Tauri CLI
        if: ${{ !matrix.tauri_rev }}
        uses: $/.github/actions/install-tauri-cli
        with:
          version: ${{ needs.resolve-tauri-cli.outputs.version }}
          github-token: ${{ github.token }}

      # The AppImage jobs build tauri-cli from a pinned upstream fork (the
      # "truly portable AppImage" format, tauri-apps/tauri#12491, not yet
      # released), so there is no prebuilt to binstall. Cache the single compiled
      # binary, keyed on the fork commit, so only the first run per commit pays
      # the ~5 min compile. Caching just the binary (not all of ~/.cargo/bin)
      # sidesteps the broken symlink restore behind Swatinem/rust-cache#341. Only
      # two such caches exist (one per arch), so eviction pressure is minimal.
      - name: Cache Tauri CLI (AppImage fork)
        id: tauri-cli-cache
        if: ${{ matrix.tauri_rev }}
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-${{ matrix.tauri_rev }}

      # TAURI_REV is a workflow-defined SHA, passed through env for consistency.
      - name: Build Tauri CLI from fork (AppImage)
        if: ${{ matrix.tauri_rev && steps.tauri-cli-cache.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          TAURI_REV: ${{ matrix.tauri_rev }}
        run: cargo install tauri-cli --git https://github.com/tauri-apps/tauri --rev "$TAURI_REV" --locked

      - name: Prepare Python bundle
        shell: bash
        run: ./build-scripts/prepare_bundle.sh ${{ matrix.target }}

      # The Tauri AppImage fork downloads quick-sharun.sh from upstream main and
      # runs it during the build. Its strace step backgrounds each traced binary
      # and kills it via `set -m` job control, which silently no-ops on tty-less
      # CI runners, so webkit2gtk's MiniBrowser never dies and the build hangs
      # until timeout (pkgforge-dev/Anylinux-AppImages regression, late June).
      # Pre-stage a copy pinned to a known commit, patched to bound each trace
      # with `timeout` instead, so the bundler reuses ours (it only downloads
      # when the file is absent).
      - name: Set up Python
        if: contains(matrix.bundles, 'appimage')
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Stage patched quick-sharun (AppImage strace hang fix)
        if: contains(matrix.bundles, 'appimage')
        run: ./build-scripts/stage_quick_sharun.sh

      # Build step - Linux with special env var
      - name: Build (Linux CI)
        if: matrix.platform == 'linux' && github.event_name != 'workflow_run'
        run: cargo tauri build --verbose --bundles ${{ matrix.bundles }}
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true

      # The release config still goes in here because it is embedded into the
      # binary at compile time. `--no-sign` skips the updater .sig files the
      # config's createUpdaterArtifacts would otherwise make, so the updater
      # key never enters this job, which runs pip installs and crate build
      # scripts. bundle-sign-upload.yml's sign-linux job signs the finished
      # bundles instead: the .AppImage after Python injection, and the
      # .deb/.rpm so latest.json can carry linux-*-deb / linux-*-rpm updater
      # targets. A deb/rpm-installed app dispatches its self-update by the bundle type
      # baked into the binary, so without those targets it falls back to the
      # AppImage payload and fails with "invalid updater binary format" (#449).
      - name: Build (Linux Release)
        if: matrix.platform == 'linux' && github.event_name == 'workflow_run'
        run: cargo tauri build --verbose --no-sign --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
        env:
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true

      # Build step - Windows CI
      # `--bundles` so the matrix stays authoritative, as it already is on Linux.
      # Without it `targets: "all"` in tauri.conf.json decides, which quietly
      # builds an MSI as well: two bundles, one of which nothing uploads or
      # installs. The E2E step below reads `bundle/nsis/`, so the guarantee it
      # depends on should be stated here rather than inherited from a default.
      - name: Build (Windows CI)
        if: matrix.platform == 'windows' && github.event_name != 'workflow_run'
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      # Windows and macOS release builds only compile here. Bundling and every
      # signature (Authenticode, Apple codesign + notarization, the updater
      # .sig) happen in bundle-sign-upload.yml's bundle-sign-* jobs, so none of
      # those credentials are ever present in this job, which runs pip installs
      # and crate build scripts. The release config still goes in here because
      # it is embedded into the binary at compile time.
      - name: Compile (Windows Release)
        if: matrix.platform == 'windows' && github.event_name == 'workflow_run'
        run: cargo tauri build --no-bundle --config src-tauri/tauri.release.conf.json

      # Build step - macOS CI
      - name: Build (macOS CI)
        if: matrix.platform == 'macos' && github.event_name != 'workflow_run'
        run: ./build-scripts/macos_build_retry.sh build ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Compile (macOS Release)
        if: matrix.platform == 'macos' && github.event_name == 'workflow_run'
        run: cargo tauri build --no-bundle ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }} --config src-tauri/tauri.release.conf.json

      # Hand everything `cargo tauri bundle` reads that is not in the checkout
      # (the compiled app and the resource trees prepare_bundle.sh built) to
      # the bundle job. A tar rather than a plain artifact upload, because the
      # artifact zip drops Unix permissions and turns the Python tree's
      # symlinks into copies; tar keeps both, and keeps the empty git/ and
      # ccache/ placeholders macOS needs. COPYFILE_DISABLE stops macOS's
      # bsdtar adding ._* AppleDouble entries for extended attributes, which
      # would unpack as stray files in the tree codesign seals.
      # bundle-sign-upload.yml deletes the artifact once every bundle job has
      # succeeded, and its upload-release-assets job only ever ships the
      # expected release files.
      - name: Package unbundled app
        if: matrix.platform != 'linux' && github.event_name == 'workflow_run'
        shell: bash
        env:
          BIN: target/${{ matrix.rust_target && format('{0}/', matrix.rust_target) || '' }}release/esphome-desktop${{ matrix.platform == 'windows' && '.exe' || '' }}
          TARBALL: intermediate-${{ matrix.target }}-unbundled.tar
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          tar -C src-tauri -cf "$TARBALL" "$BIN" python git ccache
          ls -la "$TARBALL"

      - name: Upload unbundled app
        if: matrix.platform != 'linux' && github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: intermediate-${{ matrix.target }}-unbundled.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

      # Locate the built AppImage for the inject step below, which repacks it
      # in place. Release builds upload it unsigned; bundle-sign-upload.yml's
      # sign-linux job makes its updater .sig from this final file.
      - name: Locate AppImage
        id: appimage
        if: contains(matrix.bundles, 'appimage')
        run: |
          set -euo pipefail
          mapfile -t APPIMAGES < <(find src-tauri/target/release/bundle/appimage -name "*.AppImage")
          if [ "${#APPIMAGES[@]}" -ne 1 ]; then
            echo "expected exactly one AppImage, found ${#APPIMAGES[@]}: ${APPIMAGES[*]}" >&2
            exit 1
          fi
          printf 'path=%s\n' "${APPIMAGES[0]}" >> "$GITHUB_OUTPUT"

      # The sharun-based AppImage format uses DwarFS and does not include Tauri
      # resources; see the script for how Python is injected and the image
      # repacked.
      - name: Inject Python into AppImage
        if: contains(matrix.bundles, 'appimage')
        env:
          APPIMAGE: ${{ steps.appimage.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build-scripts/inject_python_appimage.sh "$APPIMAGE"

      # Upload artifacts
      # CI builds only. The release installer comes from
      # bundle-sign-upload.yml.
      - name: Upload NSIS (CI)
        if: contains(matrix.bundles, 'nsis') && github.event_name != 'workflow_run'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: src-tauri/target/release/bundle/nsis/*.exe
          archive: false

      # After the upload on purpose: this is the one failure nobody can
      # reproduce locally, so the installer that failed has to survive as an
      # artifact rather than being suppressed by the step that rejected it.
      #
      # Exercises the installed bundle rather than the crate — it installs what
      # we just built, starts it, and force-kills the desktop to prove the real
      # `python.exe` cannot outlive it. The unit tests cover the job object's
      # mechanics; only this covers the actual app.
      #
      # CI bundle only. The release build is signed and `workflow_run`-triggered,
      # and installing a GUI app between a tag and its artifacts buys no signal
      # the CI leg has not already given.
      - name: E2E backend lifetime (Windows CI)
        if: matrix.platform == 'windows' && github.event_name != 'workflow_run'
        shell: pwsh
        run: ./.github/scripts/e2e_windows_backend_lifetime.ps1

      # The firewall pairing flow (#384): the app must settle without a
      # prompt when the rule already exists, an update-mode uninstall must
      # keep the rule, a real uninstall must remove it. Runs after the
      # lifetime script, which leaves the runner uninstalled.
      - name: E2E firewall rule (Windows CI)
        if: matrix.platform == 'windows' && github.event_name != 'workflow_run'
        shell: pwsh
        run: ./.github/scripts/e2e_windows_firewall.ps1

      # The overlay wipe (#417): the installer lays files over $INSTDIR
      # without deleting the previous release's, so the preinstall hook must
      # wipe the bundled trees (a stranded esphome component shadowed its
      # rename alias, failed every config read, and made the repair loop
      # forever) and reset the repair budget, and a real uninstall must not
      # strand orphaned trees. The drift tests prove the hook lines exist;
      # only this proves them against the real installer. Runs after the
      # firewall script, which leaves the runner uninstalled.
      - name: E2E overlay wipe (Windows CI)
        if: matrix.platform == 'windows' && github.event_name != 'workflow_run'
        shell: pwsh
        run: ./.github/scripts/e2e_windows_overlay_wipe.ps1

      - name: Upload AppImage
        if: contains(matrix.bundles, 'appimage')
        uses: actions/upload-artifact@v7.0.2
        with:
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          archive: false

      - name: Upload deb
        if: contains(matrix.bundles, 'deb')
        uses: actions/upload-artifact@v7.0.2
        with:
          path: src-tauri/target/release/bundle/deb/*.deb
          archive: false

      - name: Upload RPM
        if: contains(matrix.bundles, 'rpm')
        uses: actions/upload-artifact@v7.0.2
        with:
          path: src-tauri/target/release/bundle/rpm/*.rpm
          archive: false

      # CI builds only. The release DMG comes from bundle-sign-upload.yml.
      - name: Upload DMG (CI)
        if: contains(matrix.bundles, 'dmg') && github.event_name != 'workflow_run'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: src-tauri/target/${{ matrix.rust_target && format('{0}/', matrix.rust_target) || '' }}release/bundle/dmg/*.dmg
          archive: false

  # Persist PR metadata so the companion "PR Comment" workflow (which runs
  # in the base-repo context via workflow_run, granting write access to fork
  # PRs too) knows which PR to comment on. JSON so we can add more fields
  # later without changing the file format.
  upload-pr-info:
    name: Upload PR info
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions: {}
    steps:
      - name: Write PR info
        run: |
          cat > pr-info.json <<EOF
          {
            "pr_number": ${{ github.event.pull_request.number }}
          }
          EOF
      - name: Upload PR info artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: pr-info.json
          archive: false

  # The single required status check for pull requests. Branch protection
  # requires this instead of the individual "Build *" matrix legs: a docs-only PR
  # skips the build job entirely (see determine-jobs), and a skipped matrix leg
  # never reports its own named check, so requiring those names directly would
  # leave a docs-only PR waiting forever. This aggregates the PR jobs and passes
  # only when each one succeeded or was skipped, so a skipped build still merges
  # while a real build failure (or a cancelled run) blocks the merge.
  ci-status:
    name: CI Status
    if: always() && github.event_name == 'pull_request'
    needs:
      - determine-jobs
      - resolve-tauri-cli
      - build
      - upload-pr-info
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq
          echo "$NEEDS_JSON" | jq -e 'all(.result == "success" or .result == "skipped")'

  # Bundle, sign and upload release assets; see bundle-sign-upload.yml.
  # `always()` + an explicit result check, NOT the bare event guard: without a
  # status function GitHub prepends `success()`, which is false whenever any
  # job in the transitive needs chain was skipped, and `determine-jobs`
  # (pull_request only) is always skipped on workflow_run events. That
  # combination silently skipped the release on every build after #357,
  # stranding the draft release with stale assets.
  #
  # Only sign what main produced: Release Drafter can also be dispatched by
  # hand from another branch, and this run's own ref (which the `release`
  # environment's branch rule checks) is main either way, so the branch and
  # repository the triggering run built are checked here.
  bundle-sign-upload:
    name: Bundle, sign and upload
    needs: [resolve-tauri-cli, build]
    if: >-
      always() &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      needs.build.result == 'success'
    # The union of what bundle-sign-upload.yml's jobs request; a called
    # workflow can only narrow the caller's grant.
    permissions:
      contents: write
      actions: write
      id-token: write
    uses: $/.github/workflows/bundle-sign-upload.yml
    with:
      tauri-cli-version: ${{ needs.resolve-tauri-cli.outputs.version }}
