name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "Breaking Changes"
    semver-increment: major
    when:
      label: "breaking-change"
  - title: "Dependencies"
    collapse-after: 1
    semver-increment: patch
    when:
      label: "dependencies"

  # Version bumps for labels that don't have their own changelog section.
  - type: version-resolver
    semver-increment: major
    when:
      label: "major"
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - "minor"
        - "new-feature"
  # Fallback when no other version-resolver category matches; also covers
  # the bugfix, documentation and enhancement labels.
  - type: version-resolver
    semver-increment: patch

template: |
  > [!CAUTION]
  > **DO NOT PUBLISH THIS RELEASE YET!**
  > Build assets have not been uploaded. Wait for the build workflow to complete
  > and this notice to be removed before publishing.
  <!-- ASSETS_PENDING -->

  ## What's Changed

  $CHANGES
